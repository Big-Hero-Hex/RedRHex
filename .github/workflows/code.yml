name: Code contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    env:
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          matplotlib==3.10.9
          numpy==2.4.4
          pytest==9.0.3
          PyYAML==6.0.3
          tensorboard==2.20.0

      - name: Test Training Panel services
        run: python -m pytest -q -o cache_dir=${{ runner.temp }}/pytest-panel tools/training_panel/tests

      - name: Test CPU-only sim-to-real contracts
        run: >-
          python -m pytest -q
          -o cache_dir=${{ runner.temp }}/pytest-sim2real
          tools/sim2real/tests
          --ignore=tools/sim2real/tests/test_abad_target_mapping.py
          --ignore=tools/sim2real/tests/test_physics_profile.py
          --ignore=tools/sim2real/tests/test_target_delay.py
          --ignore=tools/sim2real/tests/test_torsion_spring_model.py

      - name: Test Training Panel browser-independent JavaScript
        run: |
          node --check tools/training_panel/static/app.js
          node --check tools/training_panel/remote_web/remote_app.js
          node --test tools/training_panel/remote_web/*.test.mjs

      - name: Test desktop remote launchers
        run: |
          bash tools/macos/tests/test_redrhex_remote.sh
          pwsh -NoProfile -File tools/windows/tests/test_redrhex_remote.ps1
