name: Documentation contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned documentation site dependencies
        run: python -m pip install -r docs/requirements-site.txt
      - name: Test documentation tooling
        run: python -m unittest discover tools/documentation/tests -v
      - name: Validate all documentation
        run: python -m tools.documentation validate --all
      - name: Strictly build both documentation locales
        env:
          REDRHEX_DOCS_DIR: ${{ runner.temp }}/redrhex-doc-source
          REDRHEX_DOCS_SITE_DIR: ${{ runner.temp }}/redrhex-doc-site
        run: |
          mkdir -p "$REDRHEX_DOCS_DIR" "$REDRHEX_DOCS_SITE_DIR"
          python -m tools.documentation stage-site --output "$REDRHEX_DOCS_DIR"
          mkdocs build --strict -f mkdocs.yml
      - name: Validate pull-request declaration
        if: github.event_name == 'pull_request'
        run: python -m tools.documentation.pr_declaration --event-json "$GITHUB_EVENT_PATH"
