site_name: "RedRHex Documentation"
site_description: "Bilingual operator and developer documentation for RedRHex"
site_url: "https://popcorn-volcano.github.io/RedRHex/docs/"
repo_url: "https://github.com/JasonLiaoJCS/RedRHex"
docs_dir: !ENV [REDRHEX_DOCS_DIR, docs]
site_dir: !ENV [REDRHEX_DOCS_SITE_DIR, site]
use_directory_urls: true
strict: true

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: "Use dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: "Use light mode"

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
          site_name: "RedRHex Documentation"
          site_description: "Operator and developer documentation for RedRHex"
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_name: "RedRHex 文件"
          site_description: "RedRHex 操作人員與開發人員文件"

markdown_extensions:
  - meta
  - attr_list
  - admonition
  - tables
  - toc:
      permalink: true
